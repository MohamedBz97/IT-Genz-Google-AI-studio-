<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morocco IT Talent Hub</title>
    <script>
      tailwind.config = {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      /* Optional: For a slightly smoother font rendering */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom animation for the new logo */
      @keyframes spin-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-slow {
        animation: spin-slow 8s linear infinite;
      }
       /* New reverse animation for logo */
      @keyframes spin-slow-reverse {
        from {
          transform: rotate(360deg);
        }
        to {
          transform: rotate(0deg);
        }
      }
      .animate-spin-slow-reverse {
        animation: spin-slow-reverse 6s linear infinite;
      }
      /* Custom animation for cards */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeInUp {
        opacity: 0; /* Start hidden */
        animation: fadeInUp 0.5s ease-out forwards;
      }
      /* Flashcard flip animation */
      .flashcard-container {
        perspective: 1000px;
      }
      .flashcard-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .flashcard-inner.is-flipped {
        transform: rotateY(180deg);
      }
      .flashcard-front,
      .flashcard-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden; /* Safari */
        backface-visibility: hidden;
      }
      .flashcard-back {
        transform: rotateY(180deg);
      }
      /* New Hero animations */
      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes background-pan {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .animate-background-pan {
        animation: background-pan 15s linear infinite;
      }
      
      /* New animation for text gradient shimmer */
      @keyframes text-shimmer {
        from { background-position: 200% center; }
        to { background-position: -200% center; }
      }
      .animate-text-shimmer {
        background-size: 200% auto;
        animation: text-shimmer 8s linear infinite;
      }
    </style>
